<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Caja Huanaco">
<meta name="format-detection" content="telephone=no">
<title>Caja Expohobby · Huanaco</title>
</head>
<body>
<style>
  :root{
    --ink:#1A1917;
    --ink-soft:#5C5A54;
    --paper:#FFFFFF;
    --wall:#E9E7E1;
    --line:#D2CFC7;
    --green:#0F5A4E;
    --green-dark:#0A3F37;
    --amber:#B5641A;
    --red:#9B2C2C;
    --radius:10px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0;padding:0;background:var(--wall);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:17px;line-height:1.4;
    padding-bottom:210px;
  }
  .num{font-variant-numeric:tabular-nums;letter-spacing:-0.02em}
  header{
    position:sticky;top:0;z-index:20;background:var(--paper);
    border-bottom:1px solid var(--line);padding:10px 12px 8px;
  }
  .hrow{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .brand{font-weight:700;font-size:15px;letter-spacing:.02em}
  .daystat{font-size:14px;color:var(--ink-soft)}
  .pay{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px}
  .pay button{
    padding:12px 4px;border:1px solid var(--line);background:#F7F6F3;color:var(--ink-soft);
    border-radius:var(--radius);font-size:15.5px;font-weight:600;line-height:1.15;
  }
  .pay button small{display:block;font-size:12px;font-weight:500;margin-top:2px}
  .pay button.on{background:var(--green);border-color:var(--green);color:#fff}
  section{padding:12px 12px 0}
  h2{font-size:13px;font-weight:700;color:var(--ink-soft);margin:16px 0 7px;letter-spacing:.03em}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .prod{
    position:relative;min-height:68px;padding:8px 8px;text-align:left;
    background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
    display:flex;flex-direction:column;justify-content:space-between;
  }
  .prod:active{background:#EDEBE6;transform:scale(.985)}
  .prod .n{font-size:13.5px;font-weight:600;line-height:1.2}
  .prod .p{font-size:17px;font-weight:700;margin-top:4px}
  .prod .badge{
    position:absolute;top:-7px;right:-7px;min-width:24px;height:24px;border-radius:12px;
    background:var(--green);color:#fff;font-size:13px;font-weight:700;
    display:flex;align-items:center;justify-content:center;padding:0 6px;
  }
  .prod.edit{border-style:dashed}
  .ticket{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .li{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid #EFEDE8}
  .li:last-child{border-bottom:none}
  .li .name{flex:1;font-size:15.5px}
  .li .sub{display:block;font-size:13px;color:var(--ink-soft)}
  .li .amt{font-size:17px;font-weight:700;min-width:78px;text-align:right}
  .qbtn{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:#F7F6F3;font-size:18px;font-weight:700;color:var(--ink)}
  .empty{padding:16px 12px;color:var(--ink-soft);font-size:15px}
  footer{
    position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--paper);
    border-top:1px solid var(--line);padding:9px 12px calc(10px + env(safe-area-inset-bottom));
    box-shadow:0 -6px 18px rgba(0,0,0,.07);
  }
  .totline{display:flex;align-items:baseline;justify-content:space-between}
  .totline .lbl{font-size:14px;color:var(--ink-soft)}
  .strike{text-decoration:line-through;color:var(--ink-soft);font-size:14px}
  .big{font-size:38px;font-weight:800;line-height:1.05}
  .disc{font-size:13px;color:var(--amber);font-weight:600}
  .actions{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:6px;margin-top:8px}
  .actions button{padding:14px 6px;border-radius:var(--radius);font-size:16.5px;font-weight:700;border:1px solid var(--line);background:#F7F6F3;color:var(--ink)}
  .actions .primary{background:var(--green);border-color:var(--green);color:#fff}
  .vuelto{display:flex;gap:6px;align-items:center;margin-top:8px}
  .vuelto input{flex:1;min-width:0;padding:12px;font-size:18px;border:1px solid var(--line);border-radius:var(--radius);background:#F7F6F3}
  .vuelto .out{font-size:16.5px;font-weight:700;white-space:nowrap}
  .tools{display:flex;gap:6px;flex-wrap:wrap;padding:16px 12px 24px}
  .tools button{flex:1;padding:12px 8px;font-size:14.5px;border:1px solid var(--line);background:var(--paper);border-radius:var(--radius);color:var(--ink-soft);font-weight:600}
  dialog{border:none;border-radius:14px;padding:0;width:min(92vw,420px);box-shadow:0 20px 50px rgba(0,0,0,.3)}
  dialog::backdrop{background:rgba(26,25,23,.5)}
  .dlg{padding:16px}
  .dlg h3{margin:0 0 12px;font-size:18px}
  .dlg label{display:block;font-size:13px;color:var(--ink-soft);margin:10px 0 4px}
  .dlg input,.dlg select{width:100%;padding:11px;font-size:16px;border:1px solid var(--line);border-radius:8px;background:#F7F6F3}
  .dlg .row{display:flex;gap:8px;margin-top:16px}
  .dlg .row button{flex:1;padding:13px;border-radius:8px;font-size:16px;font-weight:700;border:1px solid var(--line);background:#F7F6F3}
  .dlg .row .primary{background:var(--green);border-color:var(--green);color:#fff}
  .dlg .row .danger{background:#fff;border-color:var(--red);color:var(--red)}
  .log{font-size:14px;max-height:46vh;overflow:auto}
  .log div{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid #EFEDE8}
  .toast{
    position:fixed;left:50%;transform:translateX(-50%);bottom:200px;z-index:50;
    background:var(--ink);color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;font-weight:600;
    opacity:0;pointer-events:none;transition:opacity .18s;
  }
  .toast.show{opacity:1}
  .cliente{
    width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:11px 12px;margin-top:4px;background:var(--paper);border:1px solid var(--line);
    border-radius:var(--radius);text-align:left;font-size:15.5px;color:var(--ink-soft);
  }
  .cliente.on{border-color:var(--green);color:var(--ink)}
  .cliente b{font-weight:700}
  .cliente .flag{font-size:13px;color:var(--green);font-weight:700;white-space:nowrap}
  .check{display:flex;align-items:center;gap:10px;margin-top:14px;padding:11px;border:1px solid var(--line);border-radius:8px;background:#F7F6F3}
  .check input{width:22px;height:22px;flex:none}
  .check label{margin:0;font-size:15px;color:var(--ink);font-weight:600}
  .aviso{font-size:12px;margin-top:5px;font-weight:600}
  .grow{display:flex;gap:5px;align-items:center;margin-bottom:6px}
  .grow input{flex:1;min-width:0;padding:10px;font-size:15px;border:1px solid var(--line);border-radius:8px;background:#F7F6F3}
  .grow button{width:38px;height:40px;flex:none;border:1px solid var(--line);background:#F7F6F3;border-radius:8px;font-size:15px;font-weight:700;color:var(--ink-soft)}
  .grow button.x{background:#FFF2F2;border-color:#E7C4C4;color:var(--red)}
  .grow .cnt{font-size:11px;color:var(--ink-soft);width:34px;text-align:center;flex:none}
  .del{
    position:absolute;top:-8px;left:-8px;width:26px;height:26px;border-radius:13px;
    background:var(--red);color:#fff;font-size:15px;font-weight:700;line-height:26px;text-align:center;
  }
  .qdel{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:#FFF2F2;color:var(--red);font-size:16px;font-weight:700}
  @media (min-width:700px){
    body{font-size:19px;padding-bottom:240px}
    header,section{max-width:940px;margin-left:auto;margin-right:auto}
    footer{max-width:940px;margin-left:auto;margin-right:auto}
    .brand{font-size:17px} .daystat{font-size:16px}
    .pay button{font-size:18px;padding:15px 6px}
    .pay button small{font-size:13.5px}
    h2{font-size:15px;margin:22px 0 9px}
    .grid{gap:9px}
    .prod{min-height:84px;padding:12px}
    .prod .n{font-size:16px} .prod .p{font-size:22px}
    .prod .badge{min-width:30px;height:30px;border-radius:15px;font-size:16px}
    .cliente{font-size:18px;padding:15px} .cliente .flag{font-size:15px}
    .li{padding:11px 12px}
    .li .name{font-size:18px} .li .sub{font-size:15px} .li .amt{font-size:21px;min-width:110px}
    .qbtn,.qdel{width:44px;height:44px;font-size:22px}
    .empty{font-size:17px}
    .tools button{font-size:16px;padding:15px 10px}
    .totline .lbl{font-size:16px} .disc{font-size:15px} .strike{font-size:18px}
    .big{font-size:48px}
    .vuelto input{font-size:21px;padding:14px} .vuelto .out{font-size:19px}
    .actions button{font-size:19px;padding:17px 8px}
    .toast{font-size:17px;bottom:230px}
    dialog{width:min(90vw,560px)}
    .dlg{padding:22px}
    .dlg h3{font-size:22px}
    .dlg label{font-size:15px}
    .dlg input,.dlg select{font-size:18px;padding:13px}
    .dlg .row button{font-size:18px;padding:15px}
    .check label{font-size:17px}
    .grow input{font-size:17px;padding:12px}
    .grow button{width:44px;height:46px;font-size:18px}
    .log{font-size:16px}
  }
  @media (min-width:1000px){
    body{font-size:22px;padding-bottom:280px}
    header,section,footer{max-width:1060px}
    .brand{font-size:20px} .daystat{font-size:19px}
    .pay button{font-size:21px;padding:18px 6px}
    .pay button small{font-size:15px}
    h2{font-size:17px;margin:26px 0 11px}
    .grid{gap:11px}
    .prod{min-height:132px;padding:16px}
    .prod .n{font-size:30px} .prod .p{font-size:30px}
    .prod .badge{min-width:36px;height:36px;border-radius:18px;font-size:19px}
    .cliente{font-size:21px;padding:18px} .cliente .flag{font-size:17px}
    .li{padding:14px}
    .li .name{font-size:21px} .li .sub{font-size:17px} .li .amt{font-size:25px;min-width:140px}
    .qbtn,.qdel{width:52px;height:52px;font-size:26px}
    .empty{font-size:20px}
    .tools button{font-size:18px;padding:18px 12px}
    .totline .lbl{font-size:19px} .disc{font-size:17px} .strike{font-size:21px}
    .big{font-size:60px}
    .vuelto input{font-size:25px;padding:17px} .vuelto .out{font-size:22px}
    .actions button{font-size:22px;padding:21px 10px}
    .toast{font-size:20px;bottom:270px}
    dialog{width:min(80vw,640px)}
    .dlg{padding:28px}
    .dlg h3{font-size:26px}
    .dlg label{font-size:17px}
    .dlg input,.dlg select{font-size:21px;padding:15px}
    .dlg .row button{font-size:20px;padding:17px}
    .check label{font-size:20px} .check input{width:26px;height:26px}
    .grow input{font-size:20px;padding:14px}
    .grow button{width:50px;height:52px;font-size:20px}
    .log{font-size:18px}
  }
</style>

<noscript>
  <div style="margin:12px;padding:14px;border:2px solid #9B2C2C;border-radius:10px;background:#fff;color:#9B2C2C;font-weight:600;line-height:1.4">
    Este archivo se está abriendo en modo vista previa y por eso no aparecen los productos.
    Hay que abrirlo con un navegador (Safari o Chrome) para que funcione.
  </div>
</noscript>

<header>
  <div class="hrow">
    <span class="brand">HUANACO · Caja Expohobby</span>
    <span class="daystat num" id="daystat">0 ventas</span>
  </div>
  <div class="pay" id="pay"></div>
</header>

<section>
  <div id="cats"></div>

  <h2>Cliente</h2>
  <button class="cliente" id="btnCliente"><span id="cliTxt">Consumidor final — sin datos</span><span class="flag" id="cliFlag"></span></button>

  <h2>Ticket</h2>
  <div class="ticket" id="ticket"><div class="empty">Tocá un producto para empezar.</div></div>

  <div class="tools">
    <button id="btnEdit">Editar precios</button>
    <button id="btnAdd">+ Producto</button>
    <button id="btnGrupos">Grupos</button>
    <button id="btnLog">Ventas del día</button>
  </div>
</section>

<footer>
  <div class="totline">
    <div>
      <div class="lbl">Total a cobrar</div>
      <div class="disc" id="discLbl"></div>
    </div>
    <div style="text-align:right">
      <div class="strike num" id="subt"></div>
      <div class="big num" id="total">$0</div>
    </div>
  </div>
  <div class="vuelto" id="vueltoBox" hidden>
    <input id="paga" type="number" inputmode="numeric" placeholder="Paga con…">
    <span class="out num" id="vuelto">Vuelto —</span>
  </div>
  <div class="actions">
    <button id="btnUndo">Deshacer</button>
    <button id="btnClear">Borrar</button>
    <button class="primary" id="btnCobrar">Cobrar</button>
  </div>
</footer>

<div class="toast" id="toast"></div>

<dialog id="dlgProd"><div class="dlg">
  <h3 id="dlgProdTitle">Producto</h3>
  <label for="fName">Nombre (corto)</label>
  <input id="fName" placeholder="Ej. Madeja Single">
  <label for="fPrice">Precio</label>
  <input id="fPrice" type="number" inputmode="numeric" placeholder="25000">
  <label for="fCat">Grupo</label>
  <input id="fCat" list="catlist" placeholder="Madejas">
  <datalist id="catlist"></datalist>
  <label for="fIva">IVA</label>
  <select id="fIva">
    <option value="g">Gravado (21%)</option>
    <option value="e">Exento (libros)</option>
    <option value="p">Parte exenta (kit con libro)</option>
  </select>
  <div id="fParcial" hidden>
    <label for="fMontoEx">Importe exento dentro del precio</label>
    <input id="fMontoEx" type="number" inputmode="numeric" placeholder="75000">
  </div>
  <div class="row">
    <button id="fDelete" class="danger">Eliminar</button>
    <button id="fCancel">Cancelar</button>
    <button id="fSave" class="primary">Guardar</button>
  </div>
</div></dialog>

<dialog id="dlgLog"><div class="dlg">
  <h3>Ventas del día</h3>
  <div id="logBody" class="log"></div>
  <div id="logSum" style="margin-top:12px;font-size:14px;font-weight:700"></div>
  <div class="row">
    <button id="logCopy">Copiar resumen</button>
    <button id="logExp">Exportar a Excel</button>
    <button id="logClose" class="primary">Volver</button>
  </div>
  <div class="row">
    <button id="logReset" class="danger">Cerrar caja y borrar ventas</button>
  </div>
</div></dialog>

<dialog id="dlgFree"><div class="dlg">
  <h3>Monto libre</h3>
  <label for="fFree">Importe</label>
  <input id="fFree" type="number" inputmode="numeric" placeholder="0">
  <label for="fFreeName">Detalle (opcional)</label>
  <input id="fFreeName" placeholder="Ej. Madeja tinte especial">
  <label for="fFreeIva">IVA</label>
  <select id="fFreeIva">
    <option value="g">Gravado (21%)</option>
    <option value="e">Exento (libros)</option>
  </select>
  <div class="row">
    <button id="freeCancel">Cancelar</button>
    <button id="freeSave" class="primary">Agregar</button>
  </div>
</div></dialog>

<dialog id="dlgGru"><div class="dlg">
  <h3>Grupos de productos</h3>
  <div id="gList"></div>
  <button id="gAdd" style="width:100%;margin-top:10px;padding:12px;border:1px dashed var(--line);background:#F7F6F3;border-radius:8px;font-size:14px;font-weight:600;color:var(--ink)">+ Agregar grupo</button>
  <button id="gReset" style="width:100%;margin-top:8px;padding:10px;border:1px solid #E7C4C4;background:#FFF2F2;border-radius:8px;font-size:13px;font-weight:600;color:var(--red)">Restaurar catálogo Huanaco</button>
  <div class="row">
    <button id="gCancel">Cancelar</button>
    <button id="gSave" class="primary">Guardar</button>
  </div>
</div></dialog>

<dialog id="dlgCli"><div class="dlg">
  <h3>Datos del cliente</h3>
  <label for="cTipo">Comprobante</label>
  <select id="cTipo">
    <option value="B">Factura B — consumidor final</option>
    <option value="A">Factura A — responsable inscripto</option>
    <option value="C">Factura C — monotributo</option>
  </select>
  <label for="cEmail">Mail</label>
  <input id="cEmail" type="email" inputmode="email" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="nombre@mail.com">
  <div class="check">
    <input id="cEnviar" type="checkbox">
    <label for="cEnviar">Enviar la factura por mail</label>
  </div>
  <div id="cFiscal" hidden>
    <label for="cCuit">CUIT / CUIL (opcional)</label>
    <input id="cCuit" inputmode="numeric" placeholder="30712345678">
    <div class="aviso" id="cCuitMsg"></div>
    <label for="cNombre">Razón social o nombre</label>
    <input id="cNombre" placeholder="Opcional">
  </div>
  <div class="row">
    <button id="cClear" class="danger">Vaciar</button>
    <button id="cCancel">Cancelar</button>
    <button id="cSave" class="primary">Guardar</button>
  </div>
</div></dialog>

<dialog id="dlgExp"><div class="dlg">
  <h3>Exportar para SOS Contador</h3>
  <label for="eFecha">Fecha de los comprobantes</label>
  <input id="eFecha" type="date">
  <label for="ePv">Punto de venta</label>
  <input id="ePv" inputmode="numeric" placeholder="00001">
  <label for="eNumB">Numerar facturas B desde</label>
  <input id="eNumB" type="number" inputmode="numeric" placeholder="1">
  <label for="eNumA">Numerar facturas A desde</label>
  <input id="eNumA" type="number" inputmode="numeric" placeholder="1">
  <label for="eNumC">Numerar facturas C desde</label>
  <input id="eNumC" type="number" inputmode="numeric" placeholder="1">
  <label for="eIva">Alícuota de IVA (%) — 0 si sos monotributo</label>
  <input id="eIva" type="number" inputmode="decimal" placeholder="21">
  <label for="eExtra">Columnas extra de SOS (mail y medio de pago)</label>
  <select id="eExtra">
    <option value="no">No incluir</option>
    <option value="w">Columnas W a Z (Multicompro)</option>
    <option value="ah">Columnas AH a AK (Mis Comprobantes)</option>
  </select>
  <div class="row">
    <button id="eCopy">Copiar</button>
    <button id="eCancel">Cancelar</button>
    <button id="eDown" class="primary">Excel para SOS</button>
  </div>
  <div class="row">
    <button id="eDet">Excel de detalle (cobros y mails)</button>
  </div>
  <label for="eCobModo">Archivo de cobros para SOS</label>
  <select id="eCobModo">
    <option value="venta">Una fila por venta</option>
    <option value="medio">Un total por medio de pago</option>
  </select>
  <div class="row">
    <button id="eCob">Excel de cobros</button>
  </div>
</div></dialog>

/* ---------- guardado local (sin internet) ---------- */
const STORE = (function(){
  const mem = {};
  const fallback = { getItem:k=>(k in mem?mem[k]:null), setItem:(k,v)=>{mem[k]=String(v)} };
  let s = fallback, persistente = false;
  for(const cand of ['localStorage','sessionStorage']){
    try{
      const st = window[cand];
      st.setItem('__prueba','1'); st.removeItem('__prueba');
      s = st; persistente = (cand === 'localStorage'); break;
    }catch(e){}
  }
  return {
    get: k => { try{ return s.getItem(k); }catch(e){ return null; } },
    set: (k,v) => { try{ s.setItem(k,v); }catch(e){} },
    persistente
  };
})();

async function load(){
  try{ const v = STORE.get('expohobby:cfg'); if(v) cfg = JSON.parse(v); }catch(e){}
  if(cfg.catalogo !== DEFAULTS.catalogo){
    cfg = JSON.parse(JSON.stringify(DEFAULTS));
    STORE.set('expohobby:cfg', JSON.stringify(cfg));
  }
  try{ const v = STORE.get('expohobby:ventas'); if(v) ventas = JSON.parse(v); }catch(e){}
  if(!cfg.pagos) cfg.pagos = DEFAULTS.pagos;
  if(!cfg.productos) cfg.productos = DEFAULTS.productos;
  if(!Array.isArray(cfg.grupos) || !cfg.grupos.length){
    cfg.grupos = [...new Set(cfg.productos.map(p=>p.cat))];
  }
  cfg.productos.forEach(p=>{ if(!cfg.grupos.includes(p.cat)) cfg.grupos.push(p.cat); });
}
async function saveCfg(){ STORE.set('expohobby:cfg', JSON.stringify(cfg)); }
async function saveVentas(){ STORE.set('expohobby:ventas', JSON.stringify(ventas)); }

let gTmp = [];
function syncG(){
  [...document.querySelectorAll('#gList .grow input')].forEach((inp,i)=>{ if(gTmp[i]) gTmp[i].nombre = inp.value; });
}
function renderGrupos(){
  const cont = document.getElementById('gList');
  cont.innerHTML = '';
  gTmp.forEach((g,i)=>{
    const row = document.createElement('div'); row.className='grow';
    const inp = document.createElement('input'); inp.value = g.nombre; inp.placeholder='Nombre del grupo';
    const cnt = document.createElement('span'); cnt.className='cnt';
    const n = g.orig ? cfg.productos.filter(p=>p.cat===g.orig).length : 0;
    cnt.textContent = n ? n+' art.' : 'vacío';
    const up = document.createElement('button'); up.textContent='↑'; up.disabled = i===0;
    up.onclick = ()=>{ syncG(); [gTmp[i-1],gTmp[i]]=[gTmp[i],gTmp[i-1]]; renderGrupos(); };
    const dn = document.createElement('button'); dn.textContent='↓'; dn.disabled = i===gTmp.length-1;
    dn.onclick = ()=>{ syncG(); [gTmp[i+1],gTmp[i]]=[gTmp[i],gTmp[i+1]]; renderGrupos(); };
    const x = document.createElement('button'); x.textContent='✕'; x.className='x';
    x.onclick = ()=>{
      syncG();
      if(n && !confirm('El grupo "'+g.orig+'" tiene '+n+' producto(s). Si lo borrás se eliminan también. ¿Seguir?')) return;
      gTmp.splice(i,1); renderGrupos();
    };
    row.append(inp, cnt, up, dn, x);
    cont.appendChild(row);
  });
  if(!gTmp.length) cont.innerHTML = '<div style="color:var(--ink-soft);font-size:14px">No hay grupos. Agregá uno.</div>';
}

/* ---------- cliente ---------- */
function cuitValido(c){
  if(!/^\d{11}$/.test(c)) return false;
  const p = [5,4,3,2,7,6,5,4,3,2];
  let s = 0; for(let i=0;i<10;i++) s += parseInt(c[i],10) * p[i];
  let v = 11 - (s % 11); if(v === 11) v = 0; if(v === 10) v = 9;
  return v === parseInt(c[10],10);
}
const cuitLindo = c => c.length===11 ? c.slice(0,2)+'-'+c.slice(2,10)+'-'+c.slice(10) : c;

function renderCliente(){
  const b = document.getElementById('btnCliente');
  const t = document.getElementById('cliTxt');

  b.className = 'cliente' + (hay ? ' on' : '');
  const partes = ['<b>Factura '+cliente.tipo+'</b>'];
  if(cliente.nombre) partes.push(cliente.nombre);
  if(cliente.email) partes.push(cliente.email);
  if(cliente.cuit) partes.push(cuitLindo(cliente.cuit));
  if(!hay) partes.push('consumidor final');
  t.innerHTML = partes.join(' · ');
  f.textContent = cliente.enviar ? '✉ factura' : '';
}

async function borrarProducto(p){
  if(!confirm('¿Eliminar "'+p.nombre+'" de la lista de productos?')) return;
  cfg.productos = cfg.productos.filter(x=>x!==p);
  ticket = ticket.filter(i=>i.ref!==p.id);
  await saveCfg(); render(); toast('Producto eliminado');
}

function renderTicket(){
  const el = document.getElementById('ticket');
  if(!ticket.length){ el.innerHTML = '<div class="empty">Tocá un producto para empezar.</div>'; return; }
  el.innerHTML = '';
  ticket.forEach((it,idx)=>{
    const row = document.createElement('div'); row.className='li';
    const minus = document.createElement('button'); minus.className='qbtn'; minus.textContent='−';
    minus.onclick = ()=>{ it.qty--; if(it.qty<=0) ticket.splice(idx,1); render(); };
    const plus = document.createElement('button'); plus.className='qbtn'; plus.textContent='+';
    plus.onclick = ()=>{ it.qty++; render(); };
    const name = document.createElement('div'); name.className='name';
    name.innerHTML = it.nombre + '<span class="sub num">'+it.qty+' × '+fmt(it.precio)+'</span>';
    const amt = document.createElement('div'); amt.className='amt num'; amt.textContent = fmt(it.precio*it.qty);
    const del = document.createElement('button'); del.className='qdel'; del.textContent='✕'; del.title='Quitar del ticket';
    del.onclick = ()=>{ ticket.splice(idx,1); render(); };
    row.append(minus, plus, name, amt, del);
    el.appendChild(row);
  });
}

function renderTotal(){
  const s = subtotal(), t = total(), d = pagoActual().desc||0;
  document.getElementById('total').textContent = fmt(t);
  document.getElementById('subt').textContent = (d && s) ? fmt(s) : '';
  document.getElementById('discLbl').textContent = (d && s) ? pagoActual().nombre+' −'+d+'%  ('+fmt(s-t)+')' : (s?pagoActual().nombre:'');
  const vb = document.getElementById('vueltoBox');
  vb.hidden = !(pagoSel==='ef' && s>0);
  calcVuelto();
  document.getElementById('daystat').textContent =
    ventas.length + (ventas.length===1?' venta · ':' ventas · ') + fmt(ventas.reduce((a,v)=>a+v.total,0));
}

function render(){ renderProductos(); renderTicket(); renderTotal(); }

/* ---------- acciones ---------- */
function agregar(p){
  const ex = ticket.find(i=>i.ref===p.id);
  if(ex) ex.qty++; else ticket.push({ref:p.id, nombre:p.nombre, precio:p.precio, qty:1, ex:!!p.ex, exm:p.exm||0});
  render();
}
function calcVuelto(){
  const paga = parseFloat(document.getElementById('paga').value);
  const out = document.getElementById('vuelto');
  if(isNaN(paga) || !ticket.length){ out.textContent='Vuelto —'; return; }
  const v = paga - total();
  out.textContent = v>=0 ? 'Vuelto '+fmt(v) : 'Faltan '+fmt(-v);
  out.style.color = v>=0 ? 'var(--green)' : 'var(--red)';
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove('show'), 1600);
}
function limpiar(){ ticket=[]; cliente=clienteVacio(); document.getElementById('paga').value=''; renderCliente(); render(); }

document.getElementById('paga').addEventListener('input', calcVuelto);
document.getElementById('btnUndo').onclick = ()=>{
  if(!ticket.length) return;
  const last = ticket[ticket.length-1];
  last.qty--; if(last.qty<=0) ticket.pop();
  render();
};
document.getElementById('btnClear').onclick = ()=>{ if(ticket.length) limpiar(); };
document.getElementById('btnCobrar').onclick = async ()=>{
  if(!ticket.length) return;
  const t = total();
  const factor = subtotal() ? t / subtotal() : 0;
  const exento = ticket.reduce((a,i)=>a + (i.ex ? i.precio : (i.exm||0)) * i.qty, 0) * factor;
  ventas.push({ hora:new Date().toISOString(), pago:pagoActual().nombre, subtotal:subtotal(), total:t, exento:exento,
                cliente:Object.assign({}, cliente),
                items:ticket.map(i=>({n:i.nombre,q:i.qty,p:i.precio,e:!!i.ex,em:i.exm||0})) });
  await saveVentas();
  toast('Cobrado ' + fmt(t));
  limpiar();
};

  else cfg.productos.push({id:'p'+Date.now(), cat, nombre, precio, ex, exm});

  await saveCfg(); document.getElementById('dlgProd').close(); render();

        const h = new Date(v.hora).toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});
        const c = v.cliente || {};
        const cli = c.email ? ' · ' + (c.enviar?'FACTURA a ':'') + c.email + (c.cuit?' ('+cuitLindo(c.cuit)+')':'') : '';
        return h+' · '+v.pago+' · '+fmt(v.total)+' · '+v.items.map(i=>i.q+'x '+i.n).join(', ')+cli;
      }).join('\n')
    + '\n\nTOTAL: ' + fmt(ventas.reduce((a,v)=>a+v.total,0)) + '\n'
    + Object.keys(porPago).map(k=>k+': '+fmt(porPago[k])).join('\n');
  const ta = document.createElement('textarea');
  ta.value = txt; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, txt.length);
  let ok = false;
  try{ ok = document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
  if(!ok && navigator.clipboard){ navigator.clipboard.writeText(txt).then(()=>toast('Resumen copiado'),()=>toast('No se pudo copiar')); return; }
  toast(ok ? 'Resumen copiado' : 'No se pudo copiar');
};

const CODCBTE = {A:1, B:6, C:11};
function armarFilas(){
  const pv   = parseInt((document.getElementById('ePv').value || '1').replace(/\D/g,''),10) || 1;
  const desde = {
    B: parseInt(document.getElementById('eNumB').value,10) || 1,
    A: parseInt(document.getElementById('eNumA').value,10) || 1,
    C: parseInt(document.getElementById('eNumC').value,10) || 1
  };
  const num = Object.assign({}, desde);
  const alic = parseFloat(document.getElementById('eIva').value) || 0;
  const f    = document.getElementById('eFecha').value;
  const fecha = f ? f.split('-').reverse().join('/') : new Date().toLocaleDateString('es-AR');
  STORE.set('expohobby:exp', JSON.stringify({pv:String(pv), numB:desde.B, numA:desde.A, numC:desde.C, iva:alic, extra:document.getElementById('eExtra').value}));

  const dec = n => n.toFixed(2).replace('.', ',');
  const cab = ['Fecha de Emisión','Tipo de Comprobante','Punto de Venta','Número Desde','Número Hasta',
               'Cód. Autorización','Tipo Doc. Receptor','Nro. Doc. Receptor','Denominación Receptor',
               'Tipo Cambio','Moneda','Imp. Neto Gravado','Imp. Neto No Gravado','Imp. Op. Exentas',
               'Otros Tributos','IVA','Imp. Total'];
  const filas = ventas.slice().sort((a,b)=> new Date(a.hora)-new Date(b.hora)).map(v=>{
    const total  = v.total;
    const exento = Math.min(v.exento || 0, total);
    const grav   = total - exento;
    const neto   = alic ? grav / (1 + alic/100) : grav;
    const iva    = grav - neto;
    const c      = v.cliente || {};
    const tipo   = c.tipo || 'B';
    const conCuit = c.cuit && c.cuit.length === 11;
    if(num[tipo] === undefined) num[tipo] = 1;
    const n = num[tipo]++;
    return [
      fecha, CODCBTE[tipo] || 6, pv, n, n,
      '',
      conCuit ? 80 : 99,
      conCuit ? c.cuit : 0,
      conCuit ? (c.nombre || c.email || 'Cliente') : (c.nombre || 'Consumidor Final'),
      '1,00', 'PES',
      dec(neto), '0,00', dec(exento), '0,00', dec(iva), dec(total)
    ];
  });
  const extra = document.getElementById('eExtra').value;
  if(extra !== 'no'){
    const inicio = extra === 'w' ? 22 : 33;   // W = col 23, AH = col 34 (base 0)
    const relleno = inicio - cab.length;
    const vacios = new Array(relleno).fill('');
    cab.push(...vacios, 'Centro de Costo', 'Observaciones', 'E-mail', 'Teléfono');
    const orden = ventas.slice().sort((a,b)=> new Date(a.hora)-new Date(b.hora));
    filas.forEach((f,i)=>{
      const v = orden[i], c = v.cliente || {};
      f.push(...vacios, '', 'Cobro: ' + v.pago, c.email || '', '');
    });
  }
  return {cab, filas};
}

function armarCobros(){
  const pv = parseInt((document.getElementById('ePv').value || '1').replace(/\D/g,''),10) || 1;
  const num = {
    B: parseInt(document.getElementById('eNumB').value,10) || 1,
    A: parseInt(document.getElementById('eNumA').value,10) || 1,
    C: parseInt(document.getElementById('eNumC').value,10) || 1
  };
  const f = document.getElementById('eFecha').value;
  const fecha = f ? f.split('-').reverse().join('/') : new Date().toLocaleDateString('es-AR');
  const dec = n => n.toFixed(2).replace('.', ',');
  const orden = ventas.slice().sort((a,b)=> new Date(a.hora)-new Date(b.hora));
  const cab = ['Fecha','Descripción','Importe','Saldo'];
  const saldo = ['', '', '', ''];          // fila 2: reservada para el saldo de la cuenta
  let filas;

  if(document.getElementById('eCobModo').value === 'medio'){
    const porMedio = {};
    orden.forEach(v=>{ porMedio[v.pago] = (porMedio[v.pago] || 0) + v.total; });
    filas = Object.keys(porMedio).map(m => [fecha, 'Cobros ' + m + ' - Expohobby ' + fecha, dec(porMedio[m]), '']);
  }else{
    filas = orden.map(v=>{
      const c = v.cliente || {};
      const tipo = c.tipo || 'B';
      if(num[tipo] === undefined) num[tipo] = 1;
      const n = String(num[tipo]++).padStart(8,'0');
      const quien = (c.cuit && c.cuit.length === 11) ? 'CUIT ' + c.cuit + (c.nombre ? ' ' + c.nombre : '') : 'Consumidor Final';
      return [fecha, 'Cobro ' + v.pago + ' F' + tipo + ' ' + String(pv).padStart(4,'0') + '-' + n + ' ' + quien, dec(v.total), ''];
    });
  }
  return {cab, saldo, filas};
}

function armarDetalle(){
  const pv = parseInt((document.getElementById('ePv').value || '1').replace(/\D/g,''),10) || 1;
  const num = {
    B: parseInt(document.getElementById('eNumB').value,10) || 1,
    A: parseInt(document.getElementById('eNumA').value,10) || 1,
    C: parseInt(document.getElementById('eNumC').value,10) || 1
  };
  const dec = n => n.toFixed(2).replace('.', ',');
  const cab = ['Fecha','Hora','Comprobante','Punto de Venta','Número','Medio de pago','Detalle','Total','Mail','Enviar factura','CUIT','Razón social'];
  const filas = ventas.slice().sort((a,b)=> new Date(a.hora)-new Date(b.hora)).map(v=>{
    const d = new Date(v.hora), c = v.cliente || {};
    const tipo = c.tipo || 'B';
    if(num[tipo] === undefined) num[tipo] = 1;
    return [
      d.toLocaleDateString('es-AR'),
      d.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit',hour12:false}),
      'Factura ' + tipo,
      pv, num[tipo]++,
      v.pago,
      v.items.map(i=>i.q+'x '+i.n+(i.e?' (exento)':(i.em?' (parte exenta)':''))).join(' + '),
      dec(v.total),
      c.email || '', c.enviar ? 'SI' : 'NO', c.cuit || '', c.nombre || ''
    ];
  });
  return {cab, filas};
}

async function descargar(nombre, texto, mime){
  try{
    if(window.claude && typeof window.claude.use === 'function'){
      const dl = await window.claude.use('downloads');
      if(dl){ await dl.save({filename:nombre, data:'\uFEFF'+texto}); return true; }
    }
  }catch(e){ return false; }
  try{
    const blob = new Blob(['\uFEFF'+texto], {type:mime});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = nombre; a.rel='noopener';
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 2000);
    return true;
  }catch(e){ return false; }
}
